<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tahsn Bubbles</title>
<style>
:root{--bg:#e9eef8;--card:#fff;--tx:#17213a;--mut:#62708f;--ac:#3b6fe0;--glow:rgba(59,111,224,.16);--gold:#c58a1d;--bd:#d3dbee;--ink:#17213a;--serif:"Iowan Old Style",Palatino,Georgia,serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1226;--card:#161d3a;--tx:#e8ecfa;--mut:#99a5cc;--ac:#7fa6ff;--glow:rgba(127,166,255,.2);--gold:#f0bf5a;--bd:#2a3563;--ink:#e8ecfa}}
:root[data-theme="dark"]{--bg:#0d1226;--card:#161d3a;--tx:#e8ecfa;--mut:#99a5cc;--ac:#7fa6ff;--glow:rgba(127,166,255,.2);--gold:#f0bf5a;--bd:#2a3563;--ink:#e8ecfa}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:480px;margin:0 auto;padding:18px 14px 36px}
header{display:flex;justify-content:space-between;align-items:center}
h1{font:600 28px/1 var(--serif);margin:0}
.chip{background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:7px 14px;font-size:14px;color:var(--mut)}
.chip b{color:var(--gold);font-size:16px}
.win{text-align:center;color:var(--mut);font-size:14px;margin:14px 0 0}
.win b{color:var(--tx)}
svg{display:block;width:100%;max-width:340px;margin:0 auto}
.ring{fill:none;stroke:var(--mut);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:1 9;opacity:.65;transition:all .5s}
.ring.on{stroke:var(--ac);stroke-dasharray:none;stroke-width:3;opacity:1;fill:var(--glow);animation:lift .7s ease-out}
@keyframes lift{0%{transform:translateY(0)}40%{transform:translateY(-14px)}100%{transform:translateY(0)}}
.fig{stroke:var(--ink);stroke-width:5;stroke-linecap:round;fill:none}
.head{fill:var(--bg);stroke:var(--ink);stroke-width:5}
.walker{animation:bob .8s ease-in-out infinite}
.lit .walker{filter:drop-shadow(0 0 8px var(--ac))}
.leg1,.arm2{transform-origin:130px 152px;animation:sw .8s ease-in-out infinite}
.leg2,.arm1{transform-origin:130px 152px;animation:sw .8s ease-in-out infinite reverse}
.arm1,.arm2{transform-origin:130px 121px}
@keyframes sw{0%,100%{transform:rotate(-26deg)}50%{transform:rotate(26deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.ground{stroke:var(--mut);stroke-width:2;stroke-dasharray:10 14;animation:gr .8s linear infinite;opacity:.6}
@keyframes gr{to{stroke-dashoffset:48}}
.status{text-align:center;font:600 17px var(--serif);margin:4px 0 14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.box.done{border-color:var(--ac)}
.box input{width:100%;font:600 14px inherit;color:var(--tx);background:none;border:0;border-bottom:1px dashed var(--bd);padding:4px 0;text-align:center}
.box button{border:0;border-radius:10px;padding:11px 4px;font:600 15px inherit;cursor:pointer;background:var(--ac);color:var(--bg)}
.box.done button{background:none;color:var(--ac);border:1.5px solid var(--ac)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.note{color:var(--mut);font-size:13px;text-align:center;margin:14px 6px 0;line-height:1.45}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <header><h1>Tahsn</h1><span class="chip">Streak <b id="streak">0</b> · Best <span id="best">0</span></span></header>
  <p class="win" id="win"></p>
  <div id="scene">
  <svg viewBox="0 0 260 250" role="img" aria-label="Walking figure surrounded by three prayer bubbles">
    <line class="ground" x1="30" y1="204" x2="230" y2="204"/>
    <circle class="ring" id="r2" cx="130" cy="130" r="116"/>
    <circle class="ring" id="r1" cx="130" cy="130" r="86"/>
    <circle class="ring" id="r0" cx="130" cy="130" r="56"/>
    <g class="walker">
      <circle class="head" cx="130" cy="98" r="11"/>
      <line class="fig" x1="130" y1="110" x2="130" y2="152"/>
      <line class="fig arm1" x1="130" y1="121" x2="130" y2="146"/>
      <line class="fig arm2" x1="130" y1="121" x2="130" y2="146"/>
      <line class="fig leg1" x1="130" y1="152" x2="130" y2="190"/>
      <line class="fig leg2" x1="130" y1="152" x2="130" y2="190"/>
    </g>
  </svg>
  </div>
  <p class="status" id="status"></p>
  <div class="grid" id="grid"></div>
  <p class="note">Each bubble lights when you finish its prayer. All bubbles return to dotted at 12:00 and 24:00, so light all three in every 12-hour window to keep your streak.</p>
</main>
<script>
(function(){
var KEY="tahsn.bubbles.v1",S,N=3;
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
 if(!S||typeof S!=="object"||Array.isArray(S))S={};
 if(!S.w||typeof S.w!=="object")S.w={};
 if(!Array.isArray(S.names))S.names=[];
 for(var i=0;i<N;i++)S.names[i]=typeof S.names[i]==="string"&&S.names[i]?S.names[i].slice(0,30):"Prayer "+(i+1);
 S.best=+S.best>0?+S.best:0}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function p2(n){return("0"+n).slice(-2)}
function dkey(d){return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
function wid(d){return dkey(d)+(d.getHours()<12?"a":"p")}
function prev(id){var p=id.split("-"),d=new Date(+p[0],+p[1]-1,parseInt(p[2],10));
 if(id.slice(-1)==="p")return dkey(d)+"a";d.setDate(d.getDate()-1);return dkey(d)+"p"}
function get(id){var a=S.w[id];return Array.isArray(a)&&a.length===N?a.map(Boolean):[false,false,false]}
function full(id){return get(id).every(Boolean)}
function streak(id){var n=0;if(!full(id))id=prev(id);
 while(full(id)&&n<5000){n++;id=prev(id)}return n}
var $=function(i){return document.getElementById(i)};
var cur=wid(new Date());
function buildGrid(){var g=$("grid");g.innerHTML="";
 for(var i=0;i<N;i++){(function(i){
  var b=document.createElement("div");b.className="box";b.id="b"+i;
  var inp=document.createElement("input");inp.type="text";inp.maxLength=30;inp.value=S.names[i];inp.setAttribute("aria-label","Prayer "+(i+1)+" name");
  inp.oninput=function(){S.names[i]=inp.value.slice(0,30)||"Prayer "+(i+1);save()};
  var bt=document.createElement("button");bt.type="button";bt.id="d"+i;
  bt.onclick=function(){cur=wid(new Date());var a=get(cur);a[i]=!a[i];S.w[cur]=a;save();render(true,i)};
  b.appendChild(inp);b.appendChild(bt);g.appendChild(b)})(i)}}
function render(animate,which){
 var a=get(cur),c=a.filter(Boolean).length;
 for(var i=0;i<N;i++){
  var r=$("r"+i),on=a[i],was=r.classList.contains("on");
  r.classList.toggle("on",on);
  if(on&&!was&&!animate)r.style.animation="none";else r.style.animation="";
  $("b"+i).classList.toggle("done",on);
  var bt=$("d"+i);bt.textContent=on?"Done ✓":"Done";bt.setAttribute("aria-pressed",on)}
 $("scene").className=c===N?"lit":"";
 $("status").textContent=c===N?"Fully lit. You are covered until the next window.":c+" of "+N+" bubbles lit";
 var s=streak(cur);if(s>S.best){S.best=s;save()}
 $("streak").textContent=s;$("best").textContent=S.best;
 timer()}
function timer(){var n=new Date(),end=new Date(n.getFullYear(),n.getMonth(),n.getDate(),n.getHours()<12?12:24,0,0);
 var m=Math.max(0,Math.round((end-n)/60000)),h=Math.floor(m/60);
 $("win").innerHTML=(n.getHours()<12?"Morning":"Evening")+" window · resets in <b>"+h+"h "+p2(m%60)+"m</b>"}
function tick(){var id=wid(new Date());if(id!==cur){cur=id;render(false)}else timer()}
load();buildGrid();render(false);setInterval(tick,15000);
document.addEventListener("visibilitychange",function(){if(!document.hidden)tick()});
})();
</script>
</body>
</html>
